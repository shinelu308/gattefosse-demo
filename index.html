<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一镜到底 · 演示推演台｜嘉法狮中国数字营销自动化平台</title>
<meta name="description" content="嘉法狮中国 · 年度数字资产运营服务方案 —— 客户演示一镜到底推演台">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317564a'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h13' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#0e1620; --ink-2:#39464f; --ink-3:#6b7883; --ink-4:#9aa5ad;
    --line:#e3e8ea; --line-2:#ccd5d9;
    --bg:#eef2f3; --paper:#ffffff; --paper-2:#f8fafb;
    --accent:#17564a; --accent-2:#2c7a68; --accent-soft:#e7f1ee;
    --gold:#a97c1c; --gold-soft:#fdf6e7;
    --red:#b4362f; --red-soft:#fdeeed;
    --green:#2f7a4f; --green-soft:#ecf7f0;
    --side-w:236px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  /* ⚠️ 应用壳必须显式给高度、并让中段可伸缩（min-height:0）。
     否则 #body 的百分比高度算不出来 → #main 拿不到高度约束 → 内容被 body{overflow:hidden} 切掉且无法滚动 */
  #app{height:100%;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* ══════════ 顶栏 ══════════ */
  #top{
    flex:none;height:52px;background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 16px;position:relative;z-index:30;
  }
  #brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
  #brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  #brand small{font-weight:500;color:var(--ink-4);font-size:11.5px;letter-spacing:.02em}
  .top-sp{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:7px;height:29px;padding:0 11px;border-radius:7px;
    background:var(--paper-2);border:1px solid var(--line);font-size:12.5px;font-weight:700;
    color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .pill b{color:var(--accent);font-weight:800}
  .pill.warn{border-color:#eccfa0;background:var(--gold-soft);color:var(--gold)}
  .btn{
    height:29px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper);
    font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s,color .15s;white-space:nowrap;
  }
  .btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .btn kbd{
    font-family:inherit;font-size:10.5px;background:var(--bg);border:1px solid var(--line-2);
    border-radius:4px;padding:0 4px;line-height:15px;color:var(--ink-3);font-weight:700;
  }
  #menuBtn{display:none}

  /* ══════════ 主体 ══════════ */
  #body{flex:1 1 auto;min-height:0;display:flex;overflow:hidden}

  /* ── 侧栏 ── */
  #side{
    width:var(--side-w);flex:none;background:var(--paper);border-right:1px solid var(--line);
    overflow-y:auto;padding:12px 10px 20px;transition:margin-left .22s ease;
  }
  #app.fold #side{margin-left:calc(-1 * var(--side-w))}
  .side-h{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--ink-4);padding:6px 8px 8px;text-transform:uppercase}
  .nav-item{
    display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;margin-bottom:2px;transition:background .13s,border-color .13s;
    text-decoration:none;color:inherit;
  }
  .nav-item:hover{background:var(--paper-2);border-color:var(--line)}
  .nav-item.on{background:var(--accent-soft);border-color:#bfd8d1}
  .nav-item .no{
    flex:none;width:20px;height:20px;border-radius:6px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--ink-3);
    font-variant-numeric:tabular-nums;margin-top:2px;
  }
  .nav-item.on .no{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav-item .tx{font-size:12.5px;font-weight:700;line-height:1.5;color:var(--ink-2)}
  .nav-item.on .tx{color:var(--accent)}
  .nav-item .tm{font-size:10.5px;color:var(--ink-4);font-variant-numeric:tabular-nums;margin-top:1px}
  .nav-item.done .no{background:var(--green-soft);border-color:#bfe0cb;color:var(--green)}
  .side-sep{height:1px;background:var(--line);margin:10px 8px}

  /* ── 主区 ── */
  #main{flex:1 1 auto;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px 28px 40px;scroll-behavior:smooth}
  .scene{max-width:1080px;margin:0 auto}

  .sc-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .sc-no{
    flex:none;width:44px;height:44px;border-radius:11px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .sc-t{flex:1;min-width:200px}
  .sc-t h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
  .sc-t .sub{font-size:13px;color:var(--ink-3);margin-top:3px}
  .sc-badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .bdg{
    font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:6px;line-height:1.6;white-space:nowrap;
    background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;
  }
  .bdg.g{background:var(--green-soft);color:var(--green)}
  .bdg.r{background:var(--red-soft);color:var(--red)}
  .bdg.y{background:var(--gold-soft);color:var(--gold)}
  .bdg.n{background:#f0f2f4;color:var(--ink-3)}

  /* ── 区块 ── */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px}
  .card.tight{padding:16px 18px}
  .card-h{
    display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.1em;
    color:var(--ink-4);text-transform:uppercase;margin-bottom:13px;
  }
  .card-h .ic{width:16px;height:16px;flex:none;color:var(--accent)}
  .card-h.script .ic{color:var(--accent)}
  .card-h.act .ic{color:var(--gold)}
  .card-h.evc .ic{color:var(--green)}

  /* ── 讲稿 ── */
  .line{margin:0 0 11px;font-size:16px;line-height:1.85;color:var(--ink-2)}
  .line:last-child{margin-bottom:0}
  .line.big{
    font-size:20px;font-weight:800;line-height:1.7;color:var(--ink);letter-spacing:-.01em;
    padding:12px 16px;background:var(--accent-soft);border-left:4px solid var(--accent);
    border-radius:0 9px 9px 0;
  }
  .line.big.gold{background:var(--gold-soft);border-left-color:#d9b463;color:#6f4f0e}
  .line.big.red{background:var(--red-soft);border-left-color:#e0928c;color:#8d2b25}
  .line em{font-style:normal;background:#fdf0d0;color:#7a5510;font-weight:800;padding:1px 6px;border-radius:4px}
  .line code{background:var(--paper-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:13.5px;color:var(--accent)}

  /* ── 动作清单 ── */
  ol.acts{margin:0;padding:0;list-style:none;counter-reset:a}
  ol.acts li{
    counter-increment:a;position:relative;padding:9px 12px 9px 40px;border-radius:9px;
    font-size:14.5px;line-height:1.75;margin-bottom:5px;background:var(--paper-2);border:1px solid var(--line);
  }
  ol.acts li::before{
    content:counter(a);position:absolute;left:11px;top:10px;width:20px;height:20px;border-radius:6px;
    background:var(--gold-soft);border:1px solid #e8d3a6;color:var(--gold);font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  ol.acts li.hot{background:var(--red-soft);border-color:#f0cdc9}
  ol.acts li.hot::before{background:#f6d6d2;border-color:#e5b3ad;color:var(--red)}
  ol.acts li .tagmini{
    font-size:10.5px;font-weight:800;color:var(--red);background:#fff;border:1px solid #ecc9c4;
    border-radius:4px;padding:0 5px;margin-left:6px;line-height:16px;display:inline-block;vertical-align:1px;
  }
  ol.acts li code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:13px;color:var(--accent)}
  ol.acts li b{color:var(--ink)}

  /* ── 证据区 ── */
  .ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
  .ev{
    border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper-2);
    cursor:zoom-in;transition:border-color .15s,box-shadow .15s,transform .15s;
  }
  .ev:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(23,86,74,.13);transform:translateY(-1px)}
  .ev .im{display:block;width:100%;height:132px;object-fit:cover;object-position:top center;background:#e9edee}
  .ev .cap{padding:7px 10px;font-size:12px;font-weight:700;color:var(--ink-2);line-height:1.5;border-top:1px solid var(--line);background:var(--paper)}
  .ev.wide{grid-column:1/-1}
  .ev.wide .im{height:auto;max-height:520px;object-fit:contain;object-position:top center}

  /* ── 视频 ── */
  .vid-wrap{border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid var(--line-2)}
  .vid-wrap video{display:block;width:100%;height:auto;background:#0d1117}

  /* ── 表格 ── */
  table.t{width:100%;border-collapse:collapse;font-size:13.5px;margin:0}
  table.t thead th{
    background:var(--paper-2);border:1px solid var(--line-2);border-bottom:2px solid var(--line-2);
    padding:9px 12px;text-align:left;font-weight:800;font-size:12.5px;color:var(--ink-2);line-height:1.55;
  }
  table.t td{border:1px solid var(--line);padding:9px 12px;vertical-align:top;line-height:1.72}
  table.t tbody tr:nth-child(even) td{background:var(--paper-2)}
  table.t td.k{font-weight:800;color:var(--accent);background:var(--accent-soft)}
  table.t td.num{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
  table.t .star{color:var(--gold);font-weight:800}

  /* ── 三层卡 ── */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .lvl{border:1px solid var(--line);border-radius:11px;padding:17px 18px;background:var(--paper)}
  .lvl .n{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.08em;margin-bottom:5px}
  .lvl .h{font-size:16px;font-weight:800;margin-bottom:3px;line-height:1.45}
  .lvl .r{font-size:12.5px;color:var(--ink-3);margin-bottom:11px}
  .lvl .d{font-size:13.5px;color:var(--ink-2);line-height:1.75;border-top:1px dashed var(--line-2);padding-top:11px}
  .lvl .job{display:inline-block;font-size:11.5px;font-weight:800;background:var(--red-soft);color:var(--red);border-radius:5px;padding:2px 8px;margin-bottom:9px}

  /* ── 报价卡 ── */
  .price{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px}
  .pc{border:1px solid var(--line-2);border-radius:12px;padding:18px 19px;background:var(--paper);position:relative}
  .pc.hero{border:2px solid var(--accent);background:var(--accent-soft)}
  .pc .badge{position:absolute;top:-9px;right:15px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:5px;letter-spacing:.05em}
  .pc .pn{font-size:15px;font-weight:800;margin-bottom:1px}
  .pc .pd{font-size:12px;color:var(--ink-3);margin-bottom:13px}
  .pc .pv{font-size:27px;font-weight:800;color:var(--accent);letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums}
  .pc .pm{font-size:12px;color:var(--ink-3);margin:2px 0 12px;font-variant-numeric:tabular-nums}
  .pc .pl{font-size:12.5px;color:var(--ink-2);line-height:1.72;border-top:1px dashed var(--line-2);padding-top:11px}

  /* ── 提示条 ── */
  .tip{
    display:flex;gap:10px;align-items:flex-start;padding:12px 15px;border-radius:9px;
    background:var(--gold-soft);border:1px solid #ecd9b0;font-size:13.5px;color:#6f4f0e;line-height:1.7;margin-top:12px;
  }
  .tip .ic{flex:none;width:16px;height:16px;margin-top:3px;color:var(--gold)}
  .tip.red{background:var(--red-soft);border-color:#f0cdc9;color:#8d2b25}
  .tip.red .ic{color:var(--red)}
  .tip.green{background:var(--green-soft);border-color:#c4e2d1;color:#22603c}
  .tip.green .ic{color:var(--green)}
  .tip b{color:inherit;font-weight:800}

  /* ══════════ 底栏 ══════════ */
  #foot{
    flex:none;height:54px;background:var(--paper);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 18px;position:relative;z-index:30;
  }
  #dots{display:flex;gap:5px;flex:1;align-items:center;flex-wrap:wrap}
  .dot2{
    width:22px;height:5px;border-radius:3px;background:var(--line-2);cursor:pointer;border:0;padding:0;
    transition:background .15s,width .15s;
  }
  .dot2:hover{background:var(--ink-4)}
  .dot2.on{background:var(--accent);width:34px}
  .dot2.done{background:var(--green)}
  #foot .btn{height:34px;padding:0 16px;font-size:13.5px}
  #foot .btn:disabled{opacity:.35;cursor:not-allowed}
  #foot .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  #foot .btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}

  /* ══════════ 灯箱 ══════════ */
  #lb{
    position:fixed;inset:0;background:rgba(12,20,24,.9);z-index:100;display:none;
    align-items:center;justify-content:center;padding:28px;cursor:zoom-out;
  }
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:calc(100vh - 120px);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
  #lb .cap{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#dbe4e7;font-size:13.5px;font-weight:600}
  #lb .x{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;line-height:1;background:none;border:0;opacity:.7}
  #lb .x:hover{opacity:1}

  /* ══════════ 应答口径抽屉 ══════════ */
  #qaWrap{
    position:fixed;inset:0;z-index:110;display:none;
  }
  #qaWrap.on{display:block}
  #qaMask{position:absolute;inset:0;background:rgba(12,20,24,.42)}
  #qa{
    position:absolute;top:0;right:0;bottom:0;width:min(640px,94vw);background:var(--paper);
    box-shadow:-14px 0 44px rgba(0,0,0,.18);display:flex;flex-direction:column;
    animation:slideIn .22s ease;
  }
  @keyframes slideIn{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
  #qa header{
    height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;
    border-bottom:1px solid var(--line);font-weight:800;font-size:15px;
  }
  #qa header .sp{flex:1}
  #qa .list{overflow-y:auto;padding:16px 20px 30px}
  .qa-i{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .qa-i .q{
    padding:11px 14px;background:var(--paper-2);font-weight:800;font-size:13.5px;color:var(--ink);
    cursor:pointer;display:flex;gap:9px;align-items:flex-start;line-height:1.6;
  }
  .qa-i .q .ic{flex:none;color:var(--accent);font-weight:800;font-size:12.5px;margin-top:2px}
  .qa-i .a{padding:12px 14px;font-size:13.5px;color:var(--ink-2);line-height:1.78;display:none;border-top:1px solid var(--line)}
  .qa-i.open .a{display:block}
  .qa-i .a b{color:var(--accent)}

  /* ══════════ 提示 toast ══════════ */
  #toast{
    position:fixed;left:50%;bottom:74px;transform:translate(-50%,14px);z-index:200;
    background:#14222a;color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:9px;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.24);
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ══════════ 封面幕 ══════════ */
  .cover{padding:12px 0 0}
  .cover .kicker{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
  .cover h1.ct{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.22;margin:0 0 14px}
  .cover .lead{font-size:17px;color:var(--ink-2);line-height:1.8;max-width:760px;margin:0 0 26px}
  .cover .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-bottom:22px}
  .cover .mc{border:1px solid var(--line);border-radius:11px;padding:15px 17px;background:var(--paper)}
  .cover .mc .k{font-size:11.5px;font-weight:800;color:var(--ink-4);letter-spacing:.08em;margin-bottom:5px}
  .cover .mc .v{font-size:15px;font-weight:800;color:var(--ink);line-height:1.55}
  .cover .mc .v code{font-size:13.5px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:4px}
  .cover .mc .d{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.65}
  .keys{display:flex;gap:9px;flex-wrap:wrap}
  .keycap{
    display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;
    padding:6px 12px;background:var(--paper);font-size:12.5px;color:var(--ink-2);font-weight:600;
  }
  .keycap kbd{
    font-family:inherit;font-size:11.5px;font-weight:800;background:var(--paper-2);border:1px solid var(--line-2);
    border-bottom-width:2px;border-radius:5px;padding:1px 7px;color:var(--ink);
  }

  /* ══════════ 响应式 ══════════ */
  @media (max-width:900px){
    #menuBtn{display:inline-flex}
    #side{
      position:fixed;top:52px;bottom:54px;left:0;z-index:40;box-shadow:8px 0 30px rgba(0,0,0,.13);
      margin-left:calc(-1 * var(--side-w));
    }
    #app.fold #side{margin-left:0}
    #main{padding:16px 15px 34px}
    .cover h1.ct{font-size:29px}
    .cover .lead{font-size:15.5px}
    .sc-no{width:38px;height:38px;font-size:15px;border-radius:9px}
    .sc-t h1{font-size:19.5px}
    .card{padding:16px 15px}
    .line.big{font-size:17.5px}
    #brand small{display:none}
  }

  /* ══════════ 打印 ══════════ */
  @media print{
    html,body{height:auto;overflow:visible;background:#fff;font-size:11.5px}
    #top,#foot,#side,#lb,#qaWrap,#toast{display:none!important}
    #app{display:block;height:auto;overflow:visible}
    #body{display:block;height:auto;overflow:visible}
    #main{overflow:visible;padding:0}
    .scene{max-width:100%;display:block!important}
    .card{border:none;border-top:1px solid #ddd;border-radius:0;padding:10px 0;break-inside:avoid}
    .card-h{margin-bottom:7px}
    .ev .im{height:auto;max-height:300px}
    .ev-grid{grid-template-columns:repeat(3,1fr)}
    .price{grid-template-columns:repeat(3,1fr)}
    .vid-wrap{display:none}
    @page{margin:12mm}
  }
</style>
</head>
<body>
<div id="app">

      '「<b>领先版</b>约等于一名专员<b>十个月</b>的成本，但交付的是『系统运维 + 内容生产 + 数据分析 + 活动支持』四类角色的合力。」',

      {t:'「如果贵司选择在 10 月内启动，我们承诺在<b>首月完成</b>四件事：」'}
    ],

      '一次完整的中文站内容资产盘点报告（含缺口清单与优先级）',

    ],

  }
];

/* ── 应答口径 ── */
const QA = [
  ['为什么不能继续按项目做？我们有需求再找你们不就完了。','可以，但项目制有三个天花板：需求攒够再立项，时间窗口已经过去了；每个项目结束语境就散了，明年换人要重来；还有最实际的——您每年做预算时答不出数字这块要花多少。'],
  ['基础版够用吗？','基础版解决的是「系统别出事」。但只有第一层，系统就是个昂贵的展示柜——内容没有人往里放，它三个月后就是档案柜。'],
  ['凭什么比外面的代理公司贵 / 便宜？','品牌代理公司的年度数字服务大概 15–30 万，但通常不含技术系统维护。我们是「系统运维 + 内容生产 + 数据分析」一体，出问题不用您在两拨人之间传话。'],

  ['AI 生成的内容会有合规风险吗？','这正是我们把合规预检做进系统的原因。广告法违禁词、医疗功效宣称红线都有一级硬拦，写的时候就被挡掉，不是发出去再删。'],
  ['20 个工作日开发额度用完了怎么办？','超出部分按 1,800 元/人日结算，需求先评估再进排期，不会不打招呼就产生费用。'],
  ['内容的知识产权归谁？','全部归嘉法狮中国所有——内容、素材、代码都是。'],
  ['你们能保证排名 / 流量增长吗？','我们不承诺具体排名，但承诺每月给您一份能读懂的数据报告和明确的行动项。搜索表现按季度复盘，含排名变化与流量增量。'],
  ['中文内容真的有人看吗？我们的客户都在线下。','客户决策前会上网查这一步跑不掉——这个原料有没有中文资料、有没有人用过、有没有配方案例。中文内容的密度，直接决定嘉法狮在专业客户心智中的位置。'],
  ['如果效果不好，能提前终止吗？','首月未达承诺标准可以无理由终止并退款，这是写进方案的。之后按合同条款走。']
];

/* ═══════════════════════════════════════════════════════════
   视图
   ═══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const ICONS = {
  script:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  act:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  ev:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  tip:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>',
  ext:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>'
};

let cur = 0;
const seen = new Set();
function toast(msg, ms){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), ms||1800);
}

function renderNav(){
  $('#nav').innerHTML = SCENES.map((s,i)=>`
    <div class="nav-item${i===cur?' on':''}${seen.has(i)&&i!==cur?' done':''}" data-go="${i}">
      <span class="no">${s.no}</span>
      <span>
        <span class="tx">${s.title}</span>
        <span class="tm">${s.time||s.dur||'—'}</span>
      </span>
    </div>`).join('');
}

function renderDots(){
  $('#dots').innerHTML = SCENES.map((s,i)=>
    `<button class="dot2${i===cur?' on':''}${seen.has(i)&&i!==cur?' done':''}" data-go="${i}" title="${s.title}"></button>`).join('');
}

function tipHTML(t){
  if(!t) return '';
  const cls = t.type ? ' '+t.type : '';
  return `<div class="tip${cls}">${ICONS.tip}<div>${t.tx}</div></div>`;
}

function renderScene(){
  const s = SCENES[cur];
  seen.add(cur);
  let h = '';

  /* ── 封面 ── */
  if(s.kind === 'cover'){
    h += `<div class="cover">
      <div class="kicker">Client Demo · One-Take Walkthrough</div>
      <h1 class="ct">${s.title}</h1>
      <p class="lead">${s.lead}</p>
      <div class="meta">${s.meta.map(m=>`
        <div class="mc"><div class="k">${m.k}</div><div class="v">${m.v}</div><div class="d">${m.d}</div></div>`).join('')}</div>
      <div class="keys">${s.keys.map(k=>`<span class="keycap"><kbd>${k.k}</kbd>${k.t}</span>`).join('')}</div>
      ${tipHTML(s.tip)}
    </div>`;
  } else {
    /* ── 普通幕 ── */
    h += `<div class="sc-head">
      <div class="sc-no">${s.no}</div>
      <div class="sc-t"><h1>${s.title}</h1><div class="sub">${s.sub||''}</div></div>
      <div class="sc-badges">
        ${s.time?`<span class="bdg">${s.time}</span>`:''}
        ${s.dur?`<span class="bdg n">${s.dur}</span>`:''}
      </div>
    </div>`;

    /* 讲稿 */
    if(s.script && s.script.length){
      h += `<div class="card"><div class="card-h script">${ICONS.script}讲稿</div>
        ${s.script.map(l=>{
          const cls = 'line' + (l.big?' big':'') + (l.gold?' gold':'') + (l.red?' red':'');
          return `<p class="${cls}">${l.t}</p>`;
        }).join('')}
      </div>`;
    }

    /* 视频 */
    if(s.video){
      h += `<div class="card"><div class="card-h evc">${ICONS.ev}证据 · 视频</div>
        <div class="vid-wrap"><video src="${s.video.src}" poster="${s.video.poster}" controls preload="metadata" playsinline></video></div>
      </div>`;
    }

    /* 动作 */
    if(s.acts && s.acts.length){
      h += `<div class="card"><div class="card-h act">${ICONS.act}现场动作 · 按这个顺序演</div>
        <ol class="acts">${s.acts.map(a=>{
          const o = typeof a === 'string' ? {t:a} : a;
          return `<li class="${o.hot?'hot':''}">${o.t}${o.m?`<span class="tagmini">${o.m}</span>`:''}</li>`;
        }).join('')}</ol>
      </div>`;
    }

    /* 表格 */
    if(s.table){
      h += `<div class="card"><div class="card-h">${ICONS.act}对照 / 参照</div>
        <table class="t"><thead><tr>${s.table.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead>
        <tbody>${s.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'k':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>
      </div>`;
    }

    /* 三层 */
    if(s.levels){
      h += `<div class="card"><div class="card-h">${ICONS.act}三层结构</div>
        <div class="cols">${s.levels.map(l=>`
          <div class="lvl">
            <div class="n">${l.n}</div>
            <div class="h">${l.h}</div>
            <div class="r">${l.r}</div>
            <div class="job">${l.job}</div>
            <div class="d">${l.d}</div>
          </div>`).join('')}</div>
      </div>`;
    }

    /* 报价 */
    if(s.price){
      h += `<div class="card"><div class="card-h">${ICONS.act}三档报价</div>
        <div class="price">${s.price.map(p=>`
          <div class="pc${p.hero?' hero':''}">
            ${p.badge?`<div class="badge">${p.badge}</div>`:''}
            <div class="pn">${p.n}</div><div class="pd">${p.d}</div>
            <div class="pv">${p.v}</div><div class="pm">${p.m}</div>
            <div class="pl">${p.l}</div>
          </div>`).join('')}</div>
      </div>`;
    }

    /* 附加要点 */
    if(s.extra){
      h += `<div class="card"><div class="card-h act">${ICONS.act}必须知道的口径</div>
        <ul style="margin:0;padding-left:20px">${s.extra.map(x=>`<li class="line" style="margin-bottom:8px">${x}</li>`).join('')}</ul>
      </div>`;
    }

    /* 30 天承诺 */
    if(s.promise){
      h += `<div class="card"><div class="card-h act">${ICONS.act}首月交付清单</div>
        <ol class="acts">${s.promise.map(x=>`<li>${x}</li>`).join('')}</ol>
        <p class="line big red" style="margin-top:14px">${s.guarantee}</p>
      </div>`;
    }

    /* 证据 */
    if(s.ev && s.ev.length){
      h += `<div class="card"><div class="card-h evc">${ICONS.ev}证据 · 点图放大</div>
        <div class="ev-grid">${s.ev.map(e=>`
          <div class="ev${e.wide?' wide':''}" data-img="${A}${e.f}" data-cap="${e.c}">
            <img class="im" src="${A}${e.f}" alt="${e.c}" loading="lazy">
            <div class="cap">${e.c}</div>
          </div>`).join('')}</div>
      </div>`;
    }

    /* 外链按钮 */
    if(s.link){
      h += `<div class="card tight" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:13.5px;color:var(--ink-3)">独立可交互应用，会在新标签页打开：</span>
        <a class="btn" href="${s.link.url}" target="_blank" rel="noopener" style="text-decoration:none;color:var(--accent);border-color:var(--accent)">${ICONS.ext}${s.link.label}</a>
      </div>`;
    }

    /* 后续讲稿 */
    if(s.script2){
      h += `<div class="card"><div class="card-h script">${ICONS.script}继续讲</div>
        ${s.script2.map(l=>`<p class="line${l.big?' big':''}${l.gold?' gold':''}">${l.t}</p>`).join('')}
      </div>`;
    } else if(s.acts && s.acts[0] && s.acts[0].hot && !s.extra){
      /* close 幕已用 acts 承载动作 */
    }

    if(s.note) h += tipHTML(s.note);
    if(s.tip) h += tipHTML(s.tip);
  }

  $('#scene').innerHTML = h;
  $('#main').scrollTop = 0;
  $('#pillScene').textContent = `第 ${cur+1} / ${SCENES.length} 幕`;
  $('#btnPrev').disabled = cur === 0;
  $('#btnNext').textContent = cur === SCENES.length-1 ? '回到封面 ↺' : '下一幕 →';
  renderNav(); renderDots();
}

function go(i){
  if(i < 0) i = 0;
  if(i >= SCENES.length) i = 0;
  cur = i;
  renderScene();
}
const next = () => go(cur === SCENES.length-1 ? 0 : cur+1);
const prev = () => go(cur-1);

/* ═══════════════════════════════════════════════════════════
   交互
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if(g){ go(+g.dataset.go); if(window.innerWidth <= 900) $('#app').classList.add('fold'); return; }
  const ev = e.target.closest('.ev[data-img]');
  if(ev){ openLB(ev.dataset.img, ev.dataset.cap); return; }
});

function openLB(src, cap){
  $('#lbImg').src = src; $('#lbCap').textContent = cap || ''; $('#lb').classList.add('on');
}
$('#lb').addEventListener('click', () => $('#lb').classList.remove('on'));

$('#btnNext').addEventListener('click', next);
$('#btnPrev').addEventListener('click', prev);
$('#menuBtn').addEventListener('click', () => $('#app').classList.toggle('fold'));

/* 全屏 */
$('#btnFull').addEventListener('click', () => {
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); $('#fullTx').textContent = '退出'; }
  else { document.exitFullscreen && document.exitFullscreen(); $('#fullTx').textContent = '全屏'; }
});
document.addEventListener('fullscreenchange', () => { $('#fullTx').textContent = document.fullscreenElement ? '退出' : '全屏'; });

/* 计时 */
let t0 = 0, tick = null;
function fmt(ms){
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
$('#btnTimer').addEventListener('click', () => {
  if(tick){ clearInterval(tick); tick = null; $('#btnTimer').textContent = '继续'; }
  else {
    if(!t0) t0 = Date.now() - 0;
    const base = $('#pillTime').dataset.ms ? +$('#pillTime').dataset.ms : 0;
    t0 = Date.now() - base;
    tick = setInterval(() => {
      const ms = Date.now() - t0;
      $('#pillTime').dataset.ms = ms;
      $('#pillTime').textContent = '已用 ' + fmt(ms);
      const s = SCENES[cur];
      if(s.time){
        const parts = s.time.split('–')[1].split(':');
        const target = (+parts[0]*60 + +parts[1]) * 1000;
        $('#pillTime').classList.toggle('warn', ms > target + 120000);
      }
    }, 500);
    $('#btnTimer').textContent = '暂停';
    toast('计时开始 · 落后计划 2 分钟会变黄');
  }
});

/* 应答口径 */
function renderQA(){
  $('#qaList').innerHTML = QA.map(([q,a],i)=>`
    <div class="qa-i${i===0?' open':''}">
      <div class="q"><span class="ic">Q${i+1}</span><span>${q}</span></div>
      <div class="a">${a}</div>
    </div>`).join('');
}
$('#qaList').addEventListener('click', e => {
  const q = e.target.closest('.q'); if(q) q.parentElement.classList.toggle('open');
});
const openQA = v => $('#qaWrap').classList.toggle('on', v);
$('#btnQA').addEventListener('click', () => openQA(true));
$('#qaClose').addEventListener('click', () => openQA(false));
$('#qaMask').addEventListener('click', () => openQA(false));

/* 侧栏素材 */
$('#lnkProto').addEventListener('click', () => {
  window.open('prototype.html', '_blank', 'noopener');
  toast('原型已在新标签页打开');
});

/* 键盘 */
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'VIDEO') return;
  switch(e.key){
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); prev(); break;
    case 'Home': e.preventDefault(); go(0); break;
    case 'End': e.preventDefault(); go(SCENES.length-1); break;
    case 'f': case 'F': e.preventDefault(); $('#btnFull').click(); break;
    case 'q': case 'Q': e.preventDefault(); openQA(!$('#qaWrap').classList.contains('on')); break;
    case 's': case 'S': e.preventDefault(); $('#app').classList.toggle('fold'); break;
    case 'Escape':
      if($('#qaWrap').classList.contains('on')) openQA(false);
      else if($('#lb').classList.contains('on')) $('#lb').classList.remove('on');
      break;
  }
});

/* 打印：一次展开全部幕 */
window.addEventListener('beforeprint', () => {
  const keep = cur;
  let all = '';
  const old = $('#scene').innerHTML;
  for(let i=0;i<SCENES.length;i++){
    cur = i; renderScene();
    all += '<div style="page-break-after:always">' + $('#scene').innerHTML + '</div>';
  }
  $('#scene').innerHTML = all;
  cur = keep;
});

/* 启动 */
renderQA();
$('#pillScene').textContent = `第 1 / ${SCENES.length} 幕`;
renderScene();

/* 供自动化验收使用 */
window.__DEMO = { scenes: SCENES.length, qa: QA.length, go, get index(){ return cur; } };
window.__READY = true;
</script>
</body>
</html>
